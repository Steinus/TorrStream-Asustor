name: Sync official TorrStream and publish ASUSTOR APK
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'resources/**'
      - 'scripts/**'
      - 'tracking/**'
      - '.github/workflows/upstream-sync.yml'
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: write

concurrency:
  group: torrstream-sync
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.repository == 'Steinus/TorrStream-Asustor'
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check official release SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_upstream.py
      - name: Build TorrStream APKG
        run: python3 scripts/build.py
      - name: Commit generated APK and metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/CONTROL/config.json app/CONTROL/changelog.txt app/VERSION tracking/upstream.json latest.json dist/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: sync TorrStream and build ASUSTOR APK'
            git push
          fi
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("latest.json"))["version"])')
          tag="v${version}"
          asset="dist/torrstream_${version}_x86-64.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" --target main \
              --title "TorrStream ${version} for ASUSTOR" \
              --notes "ADM 5.1, including 5.1.4.RM62 (x86-64). Upgrades VIDAA TorrStream in place and preserves settings on port 8098. Original binary is downloaded on the NAS."
          fi
